<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VST-NJ8 CAT統合修正ロードマップの正本への案内" />
    <title>VST-NJ8 CAT 修正ロードマップ</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17231e;
        --muted: #5d6a64;
        --paper: #f5f1e8;
        --surface: #fffdf7;
        --line: #d9d2c3;
        --green: #155f4a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at top right, rgba(21, 95, 74, 0.14), transparent 28rem),
          var(--paper);
        color: var(--ink);
        font-family:
          Inter, "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, system-ui, sans-serif;
        line-height: 1.72;
      }

      main {
        width: min(720px, calc(100% - 2rem));
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 22px 55px rgba(41, 48, 43, 0.12);
        padding: clamp(1.5rem, 5vw, 3.2rem);
      }

      .eyebrow {
        margin: 0 0 0.55rem;
        color: var(--green);
        font-size: 0.76rem;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.4rem);
        line-height: 1.22;
        letter-spacing: -0.04em;
      }

      p {
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 1.5rem;
      }

      a {
        display: inline-block;
        border: 1px solid var(--green);
        border-radius: 999px;
        padding: 0.68rem 1rem;
        color: var(--green);
        font-weight: 800;
        text-decoration: none;
      }

      a.primary {
        background: var(--green);
        color: #fff;
      }

      code {
        border: 1px solid var(--line);
        border-radius: 0.35rem;
        background: #f0ece3;
        padding: 0.1rem 0.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Single source of truth</p>
      <h1>統合修正ロードマップ</h1>
      <p>
        筆記版と音声版の修正ロードマップは、文書の二重管理を避けるため筆記版リポジトリの
        <code>docs/remediation-roadmap.html</code>を正本とします。この音声版リポジトリでは、音声版固有の実装・校正チケットのみを管理します。
      </p>
      <p>
        未妥当化の潜在得点を公開しない音声版の実装判断は、
        <a href="adr/0010-public-score-reporting-default-deny.md">ADR 0010</a>に固定しています。
      </p>
      <p>
        未妥当化SE停止を除き、研究用実施をfixed-30へ固定する判断は、
        <a href="adr/0011-research-administration-fixed-length.md">ADR 0011</a>に固定しています。
      </p>
      <div class="actions">
        <a class="primary" href="https://github.com/Ryuya-dot-com/VST-NJ8_CAT_Written/blob/remediation/roadmap/docs/remediation-roadmap.html">
          GitHub上の正本を開く
        </a>
        <a href="../../VST-NJ8_CAT_Written/docs/remediation-roadmap.html">ローカルの正本を開く</a>
      </div>
    </main>
  </body>
</html>
